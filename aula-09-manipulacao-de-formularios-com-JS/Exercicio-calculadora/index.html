<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manipulação de Formulários</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Calculadora com JavaScript</h1>
    <!-- Campos da calculadora -->
    <input type="number" name="n1" id="n1" min="0" max="99">
    <input type="number" name="n2" id="n2" min="0" max="99">
    <br>
    <input type="button" value="+" onclick="somar()">
    <input type="button" value="-" onclick="subtrair()">
    <input type="button" value="x" onclick="multiplicar()">
    <input type="button" value="÷" onclick="dividir()">
    <!-- Área de resultado -->
     <h3>Resultado:</h3>
     <div id="resultado"></div>
     <input type="button" value="LIMPAR" onclick="limpar()">
     <script src="script.js"></script>
    
</body>
</html>
