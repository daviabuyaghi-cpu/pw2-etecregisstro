<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selecionando elementos do DOM</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Iniciando os estudos com DOM e JavaScript</h1>

    <p>Capturando o primeiro elemento DOM com JavaScript</p>

    <p>Eu sou um novo paragrafo...</p>

    <p id="p2">Paragrafo 2</p>

    <p name="nome">Paragrafo 3</p>

    <p class="p4">Paragrafo 4</p>

    <p selector="seletor">Paragrafo 5</p>
    
    <p>Paragrafo 6</p>



    <!-- Importando o JavaScript -->
     <script src="script.js"></script>
    
</body>
</html>
